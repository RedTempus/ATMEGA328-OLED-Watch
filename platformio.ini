[platformio]
default_envs = upload_isp

[env]
platform = atmelavr
framework = arduino
board = ATmega328P
board_build.f_cpu = 8000000L
build_unflags = -flto

; Normal firmware uploads directly through USBasp
[env:upload_isp]
upload_protocol = usbasp

upload_flags =
  -C$PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
  -p$BOARD_MCU
  -cusbasp
  -B100
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

; Only use this environment when intentionally setting fuses
; or reinstalling the serial bootloader

[env:fuses_bootloader]
board_hardware.oscillator = internal
board_bootloader.type = urboot
board_bootloader.speed = 38400
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes

;upload_protocol = usbasp
upload_flags =
  -B100